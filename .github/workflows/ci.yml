
name: Distributed Backend CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - product-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  publish-images:
    name: Publish ${{ matrix.service }} to GHCR
    runs-on: ubuntu-latest
    # no image will be published unless all four validation jobs succeed.
    needs: validate

    # Publish only after a push to dev, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/distributed-backend-system-${{ matrix.service }}:dev
            ghcr.io/${{ github.repository_owner }}/distributed-backend-system-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

          # Each image gets two tags:
          # - dev: latest image published from the development branch
          # - sha-<commit-sha>: immutable reference to a specific build
          # cache-from /cache-to :Reuses Docker build layers to speed up future builds
          # packages: write:Allows GitHub Actions to publish packages
          # push: true :Push the image to GHCR